<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Signup Test Fixture</title>
<style>body{font:16px system-ui;background:#10131d;color:#eef2ff;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:#1b2030;padding:28px;border:1px solid #343d55;border-radius:16px;width:min(420px,calc(100% - 48px))}label{display:block;margin:14px 0 6px;color:#b9c5df}input{box-sizing:border-box;width:100%;padding:12px;background:#101522;color:white;border:1px solid #46516b;border-radius:8px}button{margin-top:20px;padding:12px 18px;background:#8c72ef;color:white;border:0;border-radius:8px}#status{color:#a99aff;margin-top:14px}.note{font-size:13px;color:#9ca9c4}</style>
<div class="card"><h1>Local test signup</h1><p class="note">A mock form on 127.0.0.1 only. No real account is created.</p>
<form id="fixture"><label>Email</label><input id="email" type="email" required><label>Display name</label><input id="name" required><label>Date of birth</label><input id="dob" type="date" required><label>Test password</label><input id="password" type="password" required><button type="submit">Continue to test checkpoint</button></form><p id="status" aria-live="polite">Waiting for local test automation…</p></div>
<script>document.querySelector("#fixture").addEventListener("submit",e=>{e.preventDefault();document.querySelector("#status").textContent="Test checkpoint reached. Continue manually in this local fixture.";});</script>
